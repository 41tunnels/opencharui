server {
    # The base image (nginx-unprivileged) runs as uid 101, which cannot bind
    # a privileged port — hence 8080 rather than 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite emits content-hashed filenames under /assets, so those are safe to
    # pin forever. Everything else is served fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Written at container start from the UMAMI_* env vars (see
    # docker-entrypoint.d/40-write-config.sh), so it differs per deployment and
    # must never be cached — a stale copy would carry another operator's
    # analytics settings.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The app routes on the hash (createWebHashHistory), so the browser only
    # ever asks for /. The fallback is here for anyone who deep-links a path
    # anyway, and for a reverse proxy that rewrites one in.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
